    <style>
        :root {
            --container-w: 1265px;
            --container-h: 550px;

            --expand-offset-y: -10px;
            --expand-scale-start: 0.2;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }
        
        .scene {
            position: relative;
            filter: brightness(0.15);
            transition: filter 0.1s ease;
        }
        
        .container-wrapper,
        .container,
        .overlay-container,
        .content-layer {
            width: var(--container-w);
            height: var(--container-h);
        }
        
        .container-wrapper {
            position: relative;
            overflow: visible;
        }
        
        .container {
            background-image: url('./images/BGMod.jpg');
            background-size: auto;
            background-repeat: no-repeat;
            background-position: center 2px;
            position: relative;
            overflow: hidden;
        }
        
        .overlay-container {
            position: absolute;
            overflow: hidden;
            pointer-events: none;
            z-index: 6;
        }
        
        .overlay-image {
            position: absolute;
            top: 0;
            left: -50px;
            width: 1367px;
            height: 617px;
            transition: opacity 0.2s ease;
        }
        
        .content-layer {
            position: relative;
            overflow: visible;
        }
        
        .vhs-cassette {
            position: absolute;
            width: 28px;
            height: 192px;
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.85),
                0 3px 10px rgba(0, 0, 0, 0.75);
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
        }
        
        .vhs-poster {
            position: absolute;
            width: 300px;
            height: auto;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 0 8px 24px rgba(0, 0, 0, 0.7);
            cursor: pointer;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: none;
            transform-origin: top left;
            will-change: transform;
        }
        
        .vhs-poster.poster-visible {
            display: block;
        }
        
        .vhs-poster.expanding {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        /* ========== ОКОШКО С ОПИСАНИЕМ ФИЛЬМА ========== */
        .poster-desc {
            position: absolute;
            z-index: 25;
            max-width: 320px;
            background: rgba(22, 19, 16, 0.93);
            border: 1px solid rgba(255, 214, 140, 0.28);
            border-radius: 8px;
            padding: 12px 14px;
            color: #f0e8d8;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.45;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .poster-desc.visible {
            opacity: 1;
        }
        
        .light-switch {
            position: absolute;
            width: 56px;
            height: 93px;
            bottom: 10px;
            right: 210px;
            cursor: pointer;
            z-index: 30;
            object-fit: none;
        }
        
        /* ========== ЗВУКОВАЯ ОБЛАСТЬ (полностью невидимая) ========== */
        .vhs-sound-zone {
            position: absolute;
            left: 320px;
            bottom: 1px;
            width: 590px;
            height: 90px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 15;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: default;
        }
        
        #loadingGif {
            margin-bottom: 20px;
            max-width: 200px;
            height: auto;
        }
        
        #loadingText {
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
            transition: color 0.3s ease;
        }
        
        #loadingText.ready {
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        
        #loadingWarn {
            margin-top: 14px;
            color: #ffb347;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            max-width: 640px;
            pointer-events: none;
        }
        
        #loadingScreen.ready {
            cursor: pointer;
        }
        
        .preload-bg {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            background-image: url('https://i127.ic.org/big/2026/0615/f9/305455d4898d3ee3df879a063d09c9f9.jpg');
        }
    </style>
</head>

            { cassette: './images/tapes_vhs.jpg', poster: './images/tapes_poster.jpg', desc: '' },
            { cassette: './images/assault_vhs.jpg', poster: './images/assault_poster.jpg', desc: '' },
            { cassette: './images/fort_vhs.jpg', poster: './images/fort_poster.jpg', desc: '' },
            { cassette: './images/topi_vhs.jpg', poster: './images/topi_poster.jpg', desc: '' },

            { cassette: './images/balkan_vhs.jpg', poster: './images/balkan_poster.jpg', desc: '' },
        ];

        // Задержка перед показом описания при наведении на постер, мс
        const DESC_DELAY = 2000;
        let descTimer = null;

        // ========== СОСТОЯНИЕ ==========
        const state = {
            audioEnabled: false,
            audioElements: null,
            isLightOn: false,
            allAssetsLoaded: false,
            currentExpandedPoster: null,
            isAnimating: false,
            flickerTimer: null,
            flickerGeneration: 0,
            preloadedResources: [],
            brokenAudioCount: 0,
        };

        // ========== АУДИО ==========
        function initAudio() {
            state.audioElements = {
                pickSound1: new Audio(AUDIO_URLS.pickSound1),
                pickSound2: new Audio(AUDIO_URLS.pickSound2),
                openSounds: AUDIO_URLS.openSounds.map(url => new Audio(url)),
                backgroundMusic: new Audio(AUDIO_URLS.backgroundMusic),
                flickerSounds: AUDIO_URLS.flickerSounds.map(url => new Audio(url)),
                switchSound: new Audio(AUDIO_URLS.switchSound),
                vhsSounds: AUDIO_URLS.vhsSounds.map(url => new Audio(url)),
            };
            state.audioElements.backgroundMusic.loop = true;
            state.audioElements.backgroundMusic.volume = 0.3;
        }

        function playRandomPickSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const sound = Math.random() > 0.5
                ? state.audioElements.pickSound1
                : state.audioElements.pickSound2;
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function playOpenSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const sounds = state.audioElements.openSounds;
            const sound = sounds[Math.floor(Math.random() * sounds.length)];
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function playRandomFlickerSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const sounds = state.audioElements.flickerSounds;
            const sound = sounds[Math.floor(Math.random() * sounds.length)];
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function playSwitchSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            state.audioElements.switchSound.currentTime = 0;
            state.audioElements.switchSound.play().catch(() => {});
        }

        function playRandomVhsSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const sounds = state.audioElements.vhsSounds;
            const sound = sounds[Math.floor(Math.random() * sounds.length)];
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function stopFlickerSounds() {
            if (!state.audioElements) return;
            state.audioElements.flickerSounds.forEach(sound => {
                sound.pause();
                sound.currentTime = 0;
            });
        }

        function tryPlayBackgroundMusic() {
            const music = state.audioElements && state.audioElements.backgroundMusic;
            if (!music) return;
            const promise = music.play();
            if (!promise || typeof promise.catch !== 'function') return;
            promise.catch(() => {
                const handleInteraction = () => music.play().catch(() => {});
                document.addEventListener('click', handleInteraction, { once: true });
                document.addEventListener('keydown', handleInteraction, { once: true });
            });
        }

        // ========== ОПИСАНИЕ ФИЛЬМА ==========
        function getDescElement() {
            let el = document.getElementById('posterDesc');
            if (!el) {
                el = document.createElement('div');
                el.id = 'posterDesc';
                el.className = 'poster-desc';
                document.getElementById('container').appendChild(el);
            }
            return el;
        }

        function hidePosterDesc() {
            if (descTimer) { clearTimeout(descTimer); descTimer = null; }
            const el = document.getElementById('posterDesc');
            if (el) el.classList.remove('visible');
        }

        function showPosterDesc(poster, index) {
            const data = cassettes[index];
            const text = data ? (data.desc || '') : '';
            if (!text) return; // нет описания — окошко не показываем

            const container = document.getElementById('container');
            const el = getDescElement();
            el.textContent = text;

            const containerRect = container.getBoundingClientRect();
            const posterRect = poster.getBoundingClientRect();
            const descW = el.offsetWidth;
            const descH = el.offsetHeight;

            // Справа от постера; если не влезает — слева
            let left = (posterRect.right - containerRect.left) + 14;
            if (left + descW > containerRect.width - 8) {
                left = (posterRect.left - containerRect.left) - descW - 14;
            }
            if (left < 8) left = 8;

            let top = posterRect.top - containerRect.top;
            top = Math.max(8, Math.min(top, containerRect.height - descH - 8));

            el.style.left = left + 'px';
            el.style.top = top + 'px';
            el.classList.add('visible');
        }

        // ========== ПРЕДЗАГРУЗКА ==========
        function preloadImages() {
            const baseUrls = [
                './images/BGMod.jpg',
                './images/lightsMod.png',
                './images/catModGif.gif',
                './images/off.PNG',
                './images/on.png',
            ];

            const urls = [
                ...baseUrls,
                ...cassettes.flatMap(c => [c.cassette, c.poster]),
            ];

            return new Promise((resolve) => {
                let loaded = 0;
                const total = urls.length;
                if (total === 0) { resolve(); return; }

                urls.forEach(src => {
                    const img = new Image();
                    state.preloadedResources.push(img);
                    const done = () => {
                        loaded++;
                        if (loaded === total) resolve();
                    };
                    img.onload = done;
                    img.onerror = done;
                    img.src = src;
                });
            });
        }

        function preloadAudio() {
            return new Promise((resolve) => {
                initAudio();
                const elements = [
                    state.audioElements.pickSound1,
                    state.audioElements.pickSound2,
                    ...state.audioElements.openSounds,
                    state.audioElements.backgroundMusic,
                    state.audioElements.switchSound,
                    ...state.audioElements.flickerSounds,
                    ...state.audioElements.vhsSounds,
                ];

                let loaded = 0;
                let broken = 0;
                let settled = false;
                const total = elements.length;

                const finish = () => {
                    if (settled) return;
                    settled = true;
                    state.brokenAudioCount = broken;
                    resolve();
                };

                if (total === 0) { finish(); return; }

                setTimeout(() => {
                    finish();
                }, 25000);

                elements.forEach(audio => {
                    audio.addEventListener('canplaythrough', () => {
                        if (settled) return;
                        loaded++;
                        if (loaded === total) finish();
                    }, { once: true });

                    audio.addEventListener('error', () => {
                        broken++;
                        if (settled) return;
                        loaded++;
                        if (loaded === total) finish();
                    }, { once: true });

                    audio.load();
                });
            });
        }

        function enterScene() {
            if (!state.allAssetsLoaded) return;

            document.getElementById('loadingScreen').style.display = 'none';
            const scene = document.getElementById('scene');
            scene.style.display = 'block';

            positionOverlayContainer();
            state.isLightOn = false;
            state.audioEnabled = true;

            tryPlayBackgroundMusic();
            createCassettes();
            scheduleFlicker();

        function positionOverlayContainer() {
            const scene = document.getElementById('scene');
            const overlay = document.getElementById('overlayContainer');
            if (!scene || !overlay) return;
            const rect = scene.getBoundingClientRect();
            overlay.style.left = rect.left + 'px';
            overlay.style.top = rect.top + 'px';
        }

        // ========== СОЗДАНИЕ КАССЕТ ==========
        function createCassettes() {
            const container = document.getElementById('container');
            const fragment = document.createDocumentFragment();
            const total = Math.min(cassettes.length, GRID.COLS * GRID.ROWS);

            for (let i = 0; i < total; i++) {
                const row = Math.floor(i / GRID.COLS);
                const colInRow = i % GRID.COLS;
                const col = colInRow >= GRID.SKIP_AFTER ? colInRow + 1 : colInRow;

                const cassette = document.createElement('img');
                cassette.src = cassettes[i].cassette;
                cassette.className = 'vhs-cassette';
                cassette.id = `cassette${i + 1}`;
                cassette.dataset.index = i;

                const poster = document.createElement('img');
                poster.src = cassettes[i].poster;
                poster.className = 'vhs-poster';
                poster.id = `poster${i + 1}`;
                if (cassettes[i].posterWidth) {
                    poster.style.width = `${cassettes[i].posterWidth}px`;
                }

                // Показ описания при удержании курсора на развёрнутом постере
                poster.addEventListener('mouseenter', () => {
                    if (state.currentExpandedPoster !== poster) return;
                    if (descTimer) clearTimeout(descTimer);
                    descTimer = setTimeout(() => showPosterDesc(poster, i), DESC_DELAY);
                });
                poster.addEventListener('mouseleave', () => {
                    hidePosterDesc();
                });

                const left = col * (GRID.CASSETTE_W + GRID.GAP_X) + GRID.GLOBAL_OFFSET_X;
                let top = row * (GRID.CASSETTE_H + GRID.GAP_Y);
                if (row === 1) top += GRID.EXTRA_ROW2_OFFSET;
                if (row === 2) top += GRID.EXTRA_ROW3_OFFSET;

                cassette.style.left = `${left}px`;
                cassette.style.top = `${top}px`;

                fragment.appendChild(cassette);
                fragment.appendChild(poster);
            }

            container.appendChild(fragment);

            container.addEventListener('click', handleContainerClick);
            container.addEventListener('mouseenter', handleContainerMouseEnter, true);
            container.addEventListener('mouseleave', handleContainerMouseLeave, true);
        }

        function handleContainerClick(e) {
            const poster = e.target.closest('.vhs-poster');
            if (poster && poster.classList.contains('poster-visible')) {
                collapseCurrentPoster();
                return;
            }

            const cassette = e.target.closest('.vhs-cassette');
            if (!cassette) return;
            const index = parseInt(cassette.dataset.index, 10);
            const posterEl = document.getElementById(`poster${index + 1}`);
            handleCassetteClick(cassette, posterEl, cassettes[index].posterWidth || LAYOUT.POSTER_DEFAULT_W);
        }

        function handleContainerMouseEnter(e) {
            const cassette = e.target.closest('.vhs-cassette');
            if (!cassette) return;
            playRandomPickSound();
            const shift = Math.random() > 0.5 ? 4 : -4;
            cassette.style.transform = `translateY(${shift}px)`;
        }

        function handleContainerMouseLeave(e) {
            const cassette = e.target.closest('.vhs-cassette');
            if (!cassette) return;
            cassette.style.transform = 'none';
        }

        // ========== РАСКРЫТИЕ / СКРЫТИЕ ПОСТЕРА ==========
        function handleCassetteClick(cassette, poster, posterWidth) {
            if (state.currentExpandedPoster?.dataset.cassetteId === cassette.id) {
                collapseCurrentPoster();
                return;
            }
            if (state.currentExpandedPoster) {
                collapseCurrentPoster(() => expandCassette(cassette, poster, posterWidth));
                return;
            }
            expandCassette(cassette, poster, posterWidth);
        }

        function expandCassette(cassette, poster, posterWidth) {
            if (state.isAnimating) return;
            state.isAnimating = true;

            cassette.style.opacity = '0';
            cassette.style.pointerEvents = 'none';

            const container = document.getElementById('container');
            const containerRect = container.getBoundingClientRect();
            const cassetteRect = cassette.getBoundingClientRect();
            const x = cassetteRect.left - containerRect.left;
            const y = cassetteRect.top - containerRect.top;

            poster.style.transform = `translate(${x}px, ${y + LAYOUT.EXPAND_OFFSET_Y}px) scale(${LAYOUT.EXPAND_SCALE_START})`;
            poster.classList.add('poster-visible', 'expanding');
            poster.dataset.cassetteId = cassette.id;
            state.currentExpandedPoster = poster;

            playOpenSound();

            requestAnimationFrame(() => {
                setTimeout(() => {
                    const centerX = (LAYOUT.EXPAND_CENTER_TARGET_X - posterWidth) / 2;
                    const posterHeight = posterWidth * LAYOUT.POSTER_ASPECT_RATIO;
                    const centerY = (LAYOUT.CONTAINER_H - posterHeight) / 2 + LAYOUT.EXPAND_OFFSET_Y;
                    poster.style.transform = `translate(${centerX}px, ${centerY}px) scale(1)`;

                    setTimeout(() => {
                        poster.classList.remove('expanding');
                        state.isAnimating = false;
                    }, 300);
                }, 10);
            });
        }

        function collapseCurrentPoster(callback) {
            if (!state.currentExpandedPoster || state.isAnimating) return;
            state.isAnimating = true;
            hidePosterDesc();
            playRandomPickSound();

            const poster = state.currentExpandedPoster;
            const cassette = document.getElementById(poster.dataset.cassetteId);
            const container = document.getElementById('container');
            const containerRect = container.getBoundingClientRect();
            const cassetteRect = cassette.getBoundingClientRect();
            const x = cassetteRect.left - containerRect.left;
            const y = cassetteRect.top - containerRect.top;

            poster.classList.add('expanding');
            poster.style.transform = `translate(${x}px, ${y + LAYOUT.EXPAND_OFFSET_Y}px) scale(${LAYOUT.EXPAND_SCALE_START})`;

            setTimeout(() => {
                poster.classList.remove('poster-visible', 'expanding');
                cassette.style.opacity = '1';
                cassette.style.pointerEvents = 'auto';
                state.currentExpandedPoster = null;
                state.isAnimating = false;
                if (typeof callback === 'function') callback();
            }, 300);
        }

        // ========== ПРОЛИСТЫВАНИЕ КЛАВИШАМИ ==========
        function getCassetteIndexFromId(cassetteId) {
            const match = cassetteId.match(/cassette(\d+)/);
            return match ? parseInt(match[1], 10) - 1 : -1;
        }

        function switchPoster(direction) {
            if (!state.currentExpandedPoster || state.isAnimating) return;
            hidePosterDesc();

            const currentIndex = getCassetteIndexFromId(state.currentExpandedPoster.dataset.cassetteId);
            if (currentIndex < 0) return;

            const total = cassettes.length;
            const newIndex = (currentIndex + direction + total) % total;

            const oldCassette = document.getElementById(state.currentExpandedPoster.dataset.cassetteId);
            state.currentExpandedPoster.classList.remove('poster-visible', 'expanding');
            state.currentExpandedPoster.style.transform = '';
            if (oldCassette) {
                oldCassette.style.opacity = '1';
                oldCassette.style.pointerEvents = 'auto';
            }

            const newCassette = document.getElementById(`cassette${newIndex + 1}`);
            const newPoster = document.getElementById(`poster${newIndex + 1}`);
            if (!newCassette || !newPoster) return;

            const posterWidth = cassettes[newIndex].posterWidth || LAYOUT.POSTER_DEFAULT_W;
            expandCassette(newCassette, newPoster, posterWidth);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.currentExpandedPoster) {
                e.preventDefault();
                collapseCurrentPoster();
                return;
            }
            if (!state.currentExpandedPoster) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                switchPoster(-1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                switchPoster(1);
            }
        });

        // ========== КЛИК ВНЕ ПОСТЕРА ==========
        document.addEventListener('click', (e) => {
            const lightSwitch = document.getElementById('lightSwitch');
            if (lightSwitch && (e.target === lightSwitch || lightSwitch.contains(e.target))) {
                return;
            }
            const soundZone = document.getElementById('vhsSoundZone');
            if (soundZone && (e.target === soundZone || soundZone.contains(e.target))) {
                return;
            }
            if (!e.target.closest('.vhs-cassette') && !e.target.closest('.vhs-poster') && state.currentExpandedPoster) {
                collapseCurrentPoster();
            }
        });

        // ========== ЗВУКОВАЯ ОБЛАСТЬ ==========
        document.addEventListener('DOMContentLoaded', () => {
            const soundZone = document.getElementById('vhsSoundZone');
            if (soundZone) {
                soundZone.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playRandomVhsSound();
                });
            }

            const ls = document.getElementById('lightSwitch');
            if (ls) ls.addEventListener('click', toggleLight);
        });

        // ========== МЕРЦАНИЕ ==========
        const FLICKER_DURATION = 1500;
        const FLICKER_MIN_GAP = 40;
        const FLICKER_MAX_GAP = 190;
        const FLICKER_BRIGHTNESS_LEVELS = [0.5, 0.65, 0.8, 0.95, 1.1, 1.25];

        function startFlickerEffect(duration = FLICKER_DURATION) {
            const scene = document.getElementById('scene');
            if (!scene) return;

            const generation = ++state.flickerGeneration;
            const startTime = performance.now();

            const baseBrightness = state.isLightOn ? 1 : 0.15;

            scene.style.transition = 'none';

            function step() {
                if (generation !== state.flickerGeneration) return;

                const elapsed = performance.now() - startTime;
                if (elapsed >= duration) {
                    scene.style.filter = `brightness(${baseBrightness})`;
                    scene.style.transition = '';
                    return;
                }

                const level = FLICKER_BRIGHTNESS_LEVELS[
                    Math.floor(Math.random() * FLICKER_BRIGHTNESS_LEVELS.length)
                ];
                scene.style.filter = `brightness(${level})`;

                const nextDelay = FLICKER_MIN_GAP + Math.random() * (FLICKER_MAX_GAP - FLICKER_MIN_GAP);
                setTimeout(step, nextDelay);
            }

            step();
        }

        function scheduleFlicker() {
            const delay = 1500 + Math.random() * 3000;
            state.flickerTimer = setTimeout(() => {
                if (state.audioEnabled && state.isLightOn && Math.random() < 0.12) {
                    playRandomFlickerSound();
                    startFlickerEffect(FLICKER_DURATION);
                }
                scheduleFlicker();
            }, delay);
        }

        // ========== СВЕТ ==========
        function toggleLight() {
            const scene = document.getElementById('scene');
            const lightSwitch = document.getElementById('lightSwitch');
            const overlayImage = document.getElementById('overlayImage');

            playSwitchSound();

            if (state.isLightOn) {
                state.flickerGeneration++;
                stopFlickerSounds();
                scene.style.transition = '';
                scene.style.filter = 'brightness(0.15)';
                lightSwitch.src = LIGHT_SWITCH_SRC.off;
                overlayImage.style.opacity = '1';
                state.isLightOn = false;
            } else {
                scene.style.filter = 'brightness(1)';
                lightSwitch.src = LIGHT_SWITCH_SRC.on;
                overlayImage.style.opacity = '0.5';
                state.isLightOn = true;

                playRandomFlickerSound();
                startFlickerEffect(FLICKER_DURATION);
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        async function initialize() {
            await Promise.all([preloadImages(), preloadAudio()]);

            state.allAssetsLoaded = true;
            const loadingText = document.getElementById('loadingText');
            const loadingScreen = document.getElementById('loadingScreen');

            loadingText.firstChild.nodeValue = 'ЗАЛЕЗТЬ В ПОГРЕБОК ';

            loadingText.classList.add('ready');
            loadingScreen.classList.add('ready');

            loadingScreen.addEventListener('click', enterScene);
        }

        initialize();

        window.addEventListener('resize', () => {
            const scene = document.getElementById('scene');
            if (scene && scene.style.display !== 'none') {
                positionOverlayContainer();
            }
        });
    </script>
