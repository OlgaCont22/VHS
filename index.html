<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КОТЕЙКИН ПОГРЕБОК</title>
<link rel="icon" type="image/x-icon" href="./images/favicon.ico">
<!-- Preload hints для критичных ресурсов -->
<link rel="preload" as="image" href="./images/BGMod.jpg">
<link rel="preload" as="image" href="./images/catModGif.gif">
<style>
:root {
--container-w: 1265px;
--container-h: 550px;
--poster-default-w: 300px;
--poster-aspect: 1.4;
--expand-offset-y: -10px;
--expand-scale-start: 0.2;
}
body {
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background-color: #000;
position: relative;
overflow: hidden;
}
.scene {
position: relative;
filter: brightness(0.15);
transition: filter 0.1s ease;
}
.container-wrapper,
.container,
.overlay-container,
.content-layer {
width: var(--container-w);
height: var(--container-h);
}
.container-wrapper {
position: relative;
overflow: visible;
}
.container {
background-image: url('./images/BGMod.jpg');
background-size: auto;
background-repeat: no-repeat;
background-position: center 2px;
position: relative;
overflow: hidden;
}
.overlay-container {
position: absolute;
overflow: hidden;
pointer-events: none;
z-index: 6;
}
.overlay-image {
position: absolute;
top: 0;
left: -50px;
width: 1367px;
height: 617px;
transition: opacity 0.2s ease;
}
.content-layer {
position: relative;
overflow: visible;
}
.vhs-cassette {
position: absolute;
width: 28px;
height: 192px;
box-shadow:
0 6px 18px rgba(0, 0, 0, 0.85),
0 3px 10px rgba(0, 0, 0, 0.75);
cursor: pointer;
transition: transform 0.2s ease;
z-index: 10;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
-webkit-user-drag: none;
-khtml-user-drag: none;
-moz-user-drag: none;
-o-user-drag: none;
user-drag: none;
}
.vhs-poster {
position: absolute;
width: 300px;
height: auto;
box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 0 8px 24px rgba(0, 0, 0, 0.7);
cursor: pointer;
z-index: 20;
transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
display: none;
transform-origin: top left;
will-change: transform;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
-webkit-user-drag: none;
-khtml-user-drag: none;
-moz-user-drag: none;
-o-user-drag: none;
user-drag: none;
}
.vhs-poster.poster-visible {
display: block;
}
/* VHS-помехи поверх постера: холст того же размера и положения,
что и постер; виден только пока идут помехи */
#vhsGlitch {
position: absolute;
z-index: 21;
display: none;
pointer-events: none;
transform-origin: top left;
}
.vhs-poster.expanding {
transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
/* ========== ОКОШКО С ОПИСАНИЕМ ФИЛЬМА ========== */
.poster-desc {
position: absolute;
z-index: 25;
max-width: 320px;
background: rgba(22, 19, 16, 0.93);
border: 1px solid rgba(255, 214, 140, 0.28);
border-radius: 8px;
padding: 12px 14px;
color: #f0e8d8;
font-family: Arial, sans-serif;
font-size: 13px;
line-height: 1.45;
box-shadow: 0 8px 24px rgba(0,0,0,0.7);
opacity: 0;
pointer-events: none;
transition: opacity 0.25s ease;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
.poster-desc.visible {
opacity: 1;
}
.light-switch {
position: absolute;
width: 56px;
height: 93px;
bottom: 10px;
right: 210px;
cursor: pointer;
z-index: 30;
object-fit: none;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
-webkit-user-drag: none;
-khtml-user-drag: none;
-moz-user-drag: none;
-o-user-drag: none;
user-drag: none;
}
/* ========== ПЫЛЬ ========== */
/* Холсты внутри .scene — яркость и мерцание света действуют и на пыль.
#dust — над кассетами, под постером; #posterDust — над постером,
под окошком с описанием. */
#dust,
#spider,
#posterDust {
position: absolute;
top: 0;
left: 0;
width: var(--container-w);
height: var(--container-h);
pointer-events: none;
}
#dust { z-index: 12; }
#spider { z-index: 13; }   /* над полками и пылью, под постером */
/* ========== СВЕТ ИЗ ЩЕЛЕЙ В ПОТОЛКЕ ========== */
/* В .overlay-container, чтобы в темноте лучи действительно светились */
#ceilingLight {
position: absolute;
top: 0;
left: 0;
width: var(--container-w);
height: var(--container-h);
pointer-events: none;
}
/* ========== СВЕЧЕНИЕ ВИДЕОМАГНИТОФОНА ========== */
/* Тоже в .overlay-container: огоньки видика мягко подсвечивают полку
в темноте. Яркость при свете/темноте — из JS. */
#vcrGlow {
position: absolute;
top: 0;
left: 0;
width: var(--container-w);
height: var(--container-h);
pointer-events: none;
transition: opacity 0.6s ease;
}
.vcr-glow {
position: absolute;
border-radius: 50%;
opacity: 0.65;
transform: translate(-50%, -50%);
animation: vcrShimmer 4s ease-in-out infinite;
}
@keyframes vcrShimmer {
/* 0.65 — обычная яркость; запас до 1 — для плавной вспышки при клике */
0%, 100% { opacity: 0.65; }
50% { opacity: 0.6; }
}
@media (prefers-reduced-motion: reduce) {
.vcr-glow { animation: none; }
}
/* Потёртости, наклейки и царапины на корешках — поверх кассеты,
под пылью на торце. Рисуются в JS, у каждой кассеты свои. */
.cassette-wear {
position: absolute;
width: 28px;
height: 192px;
z-index: 10;
pointer-events: none;
transition: transform 0.2s ease;
}
/* Пыль на верхних торцах кассет — над кассетой, под летающей пылью.
Текстура генерируется в JS; при вытаскивании кассеты пыль стирается. */
.cassette-dust {
position: absolute;
width: 28px;
height: 18px;
z-index: 11;
pointer-events: none;
background-size: 100% 100%;
background-repeat: no-repeat;
transition: transform 0.2s ease, opacity 0.4s ease;
}
#posterDust { z-index: 22; }
/* ========== ЗВУКОВАЯ ОБЛАСТЬ (полностью невидимая) ========== */
.vhs-sound-zone {
position: absolute;
left: 320px;
bottom: 1px;
width: 590px;
height: 90px;
background: transparent;
border: none;
cursor: pointer;
z-index: 15;
}
#loadingScreen {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #000;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 1000;
cursor: default;
}
#loadingGif {
margin-bottom: 20px;
max-width: 200px;
height: auto;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
#loadingText {
color: #888;
font-family: Arial, sans-serif;
font-size: 24px;
text-align: center;
pointer-events: none;
transition: color 0.3s ease;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
#loadingText.ready {
color: #fff;
text-shadow: 0 0 10px #fff, 0 0 20px #fff;
}
#loadingWarn {
margin-top: 14px;
color: #ffb347;
font-family: Arial, sans-serif;
font-size: 14px;
text-align: center;
max-width: 640px;
pointer-events: none;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
#loadingScreen.ready {
cursor: pointer;
}
.preload-bg {
position: absolute;
width: 1px;
height: 1px;
overflow: hidden;
opacity: 0;
pointer-events: none;
background-image: url('https://i127.ic.org/big/2026/0615/f9/305455d4898d3ee3df879a063d09c9f9.jpg');
}
</style>
</head>
<body>
<div id="loadingScreen">
<img id="loadingGif" src="./images/catModGif.gif" alt="Loading">
<div id="loadingText">ЗАГРУЗКА, ЖДИТЕ...</div>
<div id="loadingWarn" hidden></div>
</div>
<div class="preload-bg"></div>
<div class="scene" id="scene" style="display: none;">
<div class="container-wrapper">
<div class="content-layer" id="contentLayer">
<div class="container" id="container"></div>
<canvas id="dust"></canvas>
<canvas id="spider"></canvas>
<canvas id="posterDust"></canvas>
<div id="vhsSoundZone" class="vhs-sound-zone"></div>
<img id="lightSwitch" class="light-switch" src="./images/off.PNG" alt="Выключатель света">
</div>
</div>
</div>
<div class="overlay-container" id="overlayContainer">
<img src="./images/lightsMod.png" class="overlay-image" id="overlayImage" alt="Overlay">
</div>
<script>
// ========== КОНСТАНТЫ ==========
const LAYOUT = {

// ========== ДАННЫЕ ==========
const cassettes = [
{ cassette: './images/wervolf_VHS.jpg', poster: './images/wervolf_cover.jpg', desc: '1997. УЖАСЫ, КОМЕДИЯ. Трое парней путешествуют по Европе в поисках приключений. Они находят их в Париже, когда однажды ночью предотвращают самоубийство молодой девушки.' },
{ cassette: './images/stalk_vhs.jpg', poster: './images/stalk_poster.jpg', desc: '2023. ТРИЛЛЕР, БОЕВИК, КРИМИНАЛ. В сельской местности штата Орегон девушка спасается бегством от разъярённого мужчины с ружьём.' },
{ cassette: './images/pochka_vhs.JPG', poster: './images/pochka_poster.jpg', desc: '2026. ДРАМА, КОМЕДИЯ. Коррумпированная инспектор пожарной службы узнает, что смертельно больна, и ей срочно нужна почка для пересадки. Столкнувшись с отказом презирающих её родственников, она пускается во все тяжкие и использует любые незаконные способы, чтобы выжить.' },
{ cassette: './images/machete_vhs.jpg', poster: './images/machete_poster.jpg', desc: '2010. БОЕВИК, КОМЕДИЯ, КРИМИНАЛ. Вооруженный холодным оружием коп жестоко мстит за семью. Первая главная роль харизматичного Дэнни Трехо.' },
{ cassette: './images/cycle_vhs.JPG', poster: './images/cycle_poster.jpg', desc: '2026. УЖАСЫ, ТРИЛЛЕР. Расследование жестокого убийства оборачивается для антрополога Мэг Гарланд шокирующим открытием — среди улик она находит останки отца, исчезнувшего 40 лет назад. Пытаясь разобраться в происходящем, Мэг погружается в пучину паранормального кошмара.' },
{ cassette: './images/longlegs_vhs.jpg', poster: './images/longlegs_poster.jpg', desc: '2023. ТРИЛЛЕР, УЖАСЫ, ДЕТЕКТИВ. Сотрудница ФБР с необычным даром идет по следу маньяка-сатаниста.' },
{ cassette: './images/13sins_vhs.jpg', poster: './images/13sins_poster.jpg', desc: '2013. ТРИЛЛЕР, УЖАСЫ. Чтобы зарабoтать, неудачник соглашается выполнить 13 странных заданий.' },
{ cassette: './images/cryst_vhs.jpg', poster: './images/cryst_poster.JPG', desc: '2026. УЖАСЫ, ТРИЛЛЕР, ДРАМА. Трагическая гибель мальчика Джейсона в летнем лагере из-за халатности вожатых сводит его мать с ума. Встав на путь жестокой мести, она превращает курортную зону в место кровавой бойни.' },
{ cassette: './images/claust_vhs.jpg', poster: './images/claust_poster.jpg', desc: '2021. УЖАСЫ, ТРИЛЛЕР. Безобидный квест в зловещем бункере оборачивается кошмаром для наивных участников.' },
{ cassette: './images/body_vhs.jpg', poster: './images/body_poster.jpg', desc: '1986. ДРАМА, ПРИКЛЮЧЕНИЯ. 1950-е. Лето подходит к концу. Четверо друзей-подростков отправляются посмотреть на труп.' },
{ cassette: './images/rabbit_vhs.jpg', poster: './images/rabbit_poster.jpg', desc: '2011. БОЕВИК. КРИМИНАЛ. ДРАМА. Скромный учитель вступает в тайный отряд мстителей.' },
{ cassette: './images/colombo_vhs.jpg', poster: './images/colombo_poster.jpg', desc: '1968. ДЕТЕКТИВ, КРИМИНАЛ. Лейтенант Коломбо - антипод классического детектива: он рассеян и несовременен, курит дешевые сигары, все время ходит в одном и том же мятом плаще, ездит на разваливающемся «Пежо» и за женщинами не ухлестывает, потому как давно и беспросветно женат.' },
{ cassette: './images/porn_vhs.jpg', poster: './images/porn_poster.jpg', desc: 'ДОКУМЕНТАЛЬНЫЙ. Альманах короткометражек, записанный поверх мультфильма "Аладдин".' },
{ cassette: './images/moana_vhs.JPG', poster: './images/moana_poster.jpg', desc: '2026. ФЭНТЕЗИ, КОМЕДИЯ, СЕМЕЙНЫЙ. Моана откликается на зов океана. Впервые в жизни она отправляется за риф своего острова Мотунуи вместе с прославленным полубогом Мауи.' },
{ cassette: './images/god_vhs.JPG', poster: './images/god_poster.JPG', desc: '2026. ФАНТАСТИКА, ДРАМА, ПРИКЛЮЧЕНИЯ. Земной историк Антон отправляется на планету, застрявшую в глухом Средневековье, под видом благородного дона Руматы Эсторского. Ему поручено тайно оберегать местных мыслителей и ученых, но с каждым днем соблюдать запрет на вмешательство в жестокие дела чужого мира становится все сложнее.' },

{ cassette: './images/astral_vhs.JPG', poster: './images/astral_poster2.jpg', desc: '2026. УЖАСЫ. Молодая женщина обнаруживает, что может перемещаться в небытие и приносить оттуда в наш мир зловещих призраков.' },
{ cassette: './images/kings_vhs.jpg', poster: './images/kings_poster.jpg', desc: '2008. БОЕВИК, ТРИЛЛЕР, КРИМИНАЛ. Детектив лос-анджелесской полиции, привыкший жестоко вершить правосудие в обход закона, оказывается под подозрением в убийстве бывшего напарника.' },
{ cassette: './images/zlo_vhs.jpg', poster: './images/zlo_poster.JPG', desc: '2026. УЖАСЫ. Несколько зловещих историй объединены темой смертоносного звука: от радиочастот, сводящих людей с ума, до жутких музыкальных ритуалов, вызывающих монстров. ' },
{ cassette: './images/run_vhs.jpg', poster: './images/run_poster.jpg', desc: '2026. БОЕВИК, ТРИЛЛЕР, ДРАМА. Успешная лондонская адвокатесса во время утренней пробежки узнаёт об похищении сына и вынуждена без остановки мчаться через весь город, выполняя безумные приказы телефонного шантажиста, чтобы спасти ребёнка.' },
{ cassette: './images/lie_vhs.JPG', poster: './images/lie_poster.jpg', desc: '2009. ФЭНТЕЗИ, ДРАМА, КОМЕДИЯ. В мире, где люди не умеют врать и всегда говорят только правду, неудачливый сценарист первым в истории придумывает ложь. Что позволяет ему быстро разбогатеть, изменить свою жизнь и даже создать религию.' },

{ cassette: './images/caveat_vhs.jpg', poster: './images/caveat_poster.jpg', desc: '2020. УЖАСЫ. Мужчина соглашается за деньги приглядеть за психически нестабильной Ольгой в заброшенном доме на уединённом острове, но по условиям договора даёт приковать себя длинной цепью.' },
{ cassette: './images/koteyka_vhs.jpg', poster: './images/koteyka_poster.jpg', desc: '2026. БОЕВИК, ФАНТАСТИКА, ТРИЛЛЕР. Кошка сражается с полчищами зомби, пытаясь доставить выжившим людям экспериментальную вакцину от зомби-вируса.' },

{ cassette: './images/zakl_vhs.jpg', poster: './images/zakl_poster.jpg', desc: '2025. УЖАСЫ. Экзорцисты помогают семье, которую преследует сущность из зеркал.' },

const DESC_DELAY = 500;
let descTimer = null;
// ========== СОСТОЯНИЕ ==========
const state = {
audioEnabled: false,
audioElements: null,
isLightOn: false,
allAssetsLoaded: false,
currentExpandedPoster: null,
isAnimating: false,
flickerTimer: null,
flickerGeneration: 0,
preloadedResources: [],
brokenAudioCount: 0,
};
// ========== АУДИО ==========
function initAudio() {
state.audioElements = {
pickSound1: new Audio(AUDIO_URLS.pickSound1),
pickSound2: new Audio(AUDIO_URLS.pickSound2),
openSounds: AUDIO_URLS.openSounds.map(url => new Audio(url)),
backgroundMusic: new Audio(AUDIO_URLS.backgroundMusic),
flickerSounds: AUDIO_URLS.flickerSounds.map(url => new Audio(url)),
switchSound: new Audio(AUDIO_URLS.switchSound),
vhsSounds: AUDIO_URLS.vhsSounds.map(url => new Audio(url)),
};
state.audioElements.backgroundMusic.loop = true;
state.audioElements.backgroundMusic.volume = 0.3;
}
function playRandomPickSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sound = Math.random() > 0.5
? state.audioElements.pickSound1
: state.audioElements.pickSound2;
sound.currentTime = 0;
sound.play().catch(() => {});
}
function playOpenSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sounds = state.audioElements.openSounds;
const sound = sounds[Math.floor(Math.random() * sounds.length)];
sound.currentTime = 0;
sound.play().catch(() => {});
}
function playRandomFlickerSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sounds = state.audioElements.flickerSounds;
const sound = sounds[Math.floor(Math.random() * sounds.length)];
sound.currentTime = 0;
sound.play().catch(() => {});
}
function playSwitchSound() {
if (!state.audioEnabled || !state.audioElements) return;
state.audioElements.switchSound.currentTime = 0;
state.audioElements.switchSound.play().catch(() => {});
}
function playRandomVhsSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sounds = state.audioElements.vhsSounds;
const sound = sounds[Math.floor(Math.random() * sounds.length)];
sound.currentTime = 0;
sound.play().catch(() => {});
return sound;
}
function stopFlickerSounds() {
if (!state.audioElements) return;
state.audioElements.flickerSounds.forEach(sound => {
sound.pause();
sound.currentTime = 0;
});
}
function tryPlayBackgroundMusic() {
const music = state.audioElements && state.audioElements.backgroundMusic;
if (!music) return;
const promise = music.play();
if (!promise || typeof promise.catch !== 'function') return;
promise.catch(() => {
const handleInteraction = () => music.play().catch(() => {});
document.addEventListener('click', handleInteraction, { once: true });
document.addEventListener('keydown', handleInteraction, { once: true });
});
}
// ========== ОПИСАНИЕ ФИЛЬМА ==========
function getDescElement() {
let el = document.getElementById('posterDesc');
if (!el) {
el = document.createElement('div');
el.id = 'posterDesc';
el.className = 'poster-desc';
document.getElementById('container').appendChild(el);
}
return el;
}
function hidePosterDesc() {
if (descTimer) { clearTimeout(descTimer); descTimer = null; }
const el = document.getElementById('posterDesc');
if (el) el.classList.remove('visible');
}
function showPosterDesc(poster, index) {
const data = cassettes[index];
const text = data ? (data.desc || '') : '';
if (!text) return;
const container = document.getElementById('container');
const el = getDescElement();
el.textContent = text;
const containerRect = container.getBoundingClientRect();
const posterRect = poster.getBoundingClientRect();
const descW = el.offsetWidth;
const descH = el.offsetHeight;
let left = (posterRect.right - containerRect.left) + 14;
if (left + descW > containerRect.width - 8) {
left = (posterRect.left - containerRect.left) - descW - 14;
}
if (left < 8) left = 8;
let top = posterRect.top - containerRect.top;
top = Math.max(8, Math.min(top, containerRect.height - descH - 8));
el.style.left = left + 'px';
el.style.top = top + 'px';
el.classList.add('visible');
}
// ========== ПРЕДЗАГРУЗКА ==========
function preloadImages() {
const baseUrls = [
'./images/BGMod.jpg',
'./images/lightsMod.png',
'./images/catModGif.gif',
'./images/off.PNG',
'./images/on.png',
];
const urls = [
...baseUrls,
...cassettes.flatMap(c => [c.cassette, c.poster]),
];
return new Promise((resolve) => {
let loaded = 0;
const total = urls.length;
if (total === 0) { resolve(); return; }
urls.forEach(src => {
const img = new Image();
state.preloadedResources.push(img);
const done = () => {
loaded++;
if (loaded === total) resolve();
};
img.onload = done;
img.onerror = done;
img.src = src;
});
});
}
function preloadAudio() {
return new Promise((resolve) => {
initAudio();
const elements = [
state.audioElements.pickSound1,
state.audioElements.pickSound2,
...state.audioElements.openSounds,
state.audioElements.backgroundMusic,
state.audioElements.switchSound,
...state.audioElements.flickerSounds,
...state.audioElements.vhsSounds,
];
let loaded = 0;
let broken = 0;
let settled = false;
const total = elements.length;
const finish = () => {
if (settled) return;
settled = true;
state.brokenAudioCount = broken;
resolve();
};
if (total === 0) { finish(); return; }
setTimeout(() => {
finish();
}, 25000);
elements.forEach(audio => {
audio.addEventListener('canplaythrough', () => {
if (settled) return;
loaded++;
if (loaded === total) finish();
}, { once: true });
audio.addEventListener('error', () => {
broken++;
if (settled) return;
loaded++;
if (loaded === total) finish();
}, { once: true });
audio.load();
});
});
}
function enterScene() {
if (!state.allAssetsLoaded) return;
document.getElementById('loadingScreen').style.display = 'none';
const scene = document.getElementById('scene');
scene.style.display = 'block';
positionOverlayContainer();
state.isLightOn = false;
state.audioEnabled = true;
tryPlayBackgroundMusic();
createCassettes();
setupDust();
setupSpider();
setupVcrGlow();
setupCeilingLight();
setupDraft();
scheduleFlicker();
}
// Место i-й ячейки на полках (в координатах #container)
function gridSlot(i) {
const row = Math.floor(i / GRID.COLS);
const colInRow = i % GRID.COLS;
const col = colInRow >= GRID.SKIP_AFTER ? colInRow + 1 : colInRow;
const left = col * (GRID.CASSETTE_W + GRID.GAP_X) + GRID.GLOBAL_OFFSET_X;
let top = row * (GRID.CASSETTE_H + GRID.GAP_Y);
if (row === 1) top += GRID.EXTRA_ROW2_OFFSET;
if (row === 2) top += GRID.EXTRA_ROW3_OFFSET;
return { left, top };
}
function positionOverlayContainer() {
const scene = document.getElementById('scene');
const overlay = document.getElementById('overlayContainer');
if (!scene || !overlay) return;
const rect = scene.getBoundingClientRect();
overlay.style.left = rect.left + 'px';
overlay.style.top = rect.top + 'px';
}
// ========== СОЗДАНИЕ КАССЕТ ==========
function createCassettes() {
const container = document.getElementById('container');
const fragment = document.createDocumentFragment();
const total = Math.min(cassettes.length, GRID.COLS * GRID.ROWS);
for (let i = 0; i < total; i++) {
const cassette = document.createElement('img');
cassette.src = cassettes[i].cassette;
cassette.className = 'vhs-cassette';
cassette.id = `cassette${i + 1}`;
cassette.dataset.index = i;
cassette.draggable = false; // Отключаем перетаскивание
cassette.setAttribute('draggable', 'false');
const poster = document.createElement('img');
poster.src = cassettes[i].poster;
poster.className = 'vhs-poster';
poster.id = `poster${i + 1}`;
poster.draggable = false; // Отключаем перетаскивание
poster.setAttribute('draggable', 'false');
if (cassettes[i].posterWidth) {
poster.style.width = `${cassettes[i].posterWidth}px`;
}
poster.addEventListener('mouseenter', () => {
if (state.currentExpandedPoster !== poster) return;
if (descTimer) clearTimeout(descTimer);
descTimer = setTimeout(() => showPosterDesc(poster, i), DESC_DELAY);
});
poster.addEventListener('mouseleave', () => {

for (const b of ceiling.beams) {
let shade = 1;
if (w) shade = 1 - 0.85 * Math.exp(-(((b.x0 - w.shadowX) / 45) ** 2));
b.shade += (shade - b.shade) * Math.min(1, dt * 8);
}
if (w) w.shadowX += (w.x - w.shadowX) * Math.min(1, dt * 3);
// Пыль, сыплющаяся с потолка от шагов
ceiling.sift = ceiling.sift.filter(p => now - p.born < p.life);
for (const p of ceiling.sift) {
applyDraft(p, dt, 1.5);
p.vy += 30 * dt;
p.vx += dustRand(-1, 1) * 15 * dt - p.vx * 1.5 * dt;
p.x += p.vx * dt;
p.y += p.vy * dt;
}
if (ceiling.mix < 0.01) {
if (!ceiling.cleared) { ctx.clearRect(0, 0, W, H); ceiling.cleared = true; }
return;
}
ceiling.cleared = false;
ctx.clearRect(0, 0, W, H);
const t = now / 1000;
// Лучи: готовые размытые картинки, меняется только яркость
ctx.globalCompositeOperation = 'lighter';
for (const b of ceiling.beams) {
const flick = 0.9 + 0.1 * Math.sin(t * b.sp * 2 * Math.PI + b.ph);
const k = ceiling.mix * flick * b.shade;
if (k < 0.02) continue;
ctx.globalAlpha = Math.min(1, k);
ctx.drawImage(b.sprite.canvas, b.sprite.x, 0, b.sprite.w, b.sprite.h);
}
ctx.globalAlpha = 1;
// Пылинки видны только там, где их ловит луч
const drawMote = (p) => {
const vis = beamLightAt(p.x, p.y) * ceiling.mix;
if (vis < 0.02) return;
ctx.globalAlpha = Math.min(1, p.alpha * vis * 1.6);
ctx.beginPath();
ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
ctx.fill();
};
ctx.fillStyle = 'rgb(255, 232, 195)';
for (let i = 0; i < ceiling.motes.length; i++) {
const p = ceiling.motes[i];
p.vx += dustRand(-1, 1) * 12 * dt - p.vx * 0.6 * dt;
p.vy += (dustRand(-1, 1) * 12 + 1.5) * dt - p.vy * 0.6 * dt; // чуть оседают
applyDraft(p, dt, 1.5);
p.x += p.vx * dt;
p.y += p.vy * dt;
// Улетела из лучей — появляется снова в случайном луче
if (p.y < -5 || p.y > H || beamLightAt(p.x, p.y) === 0 && Math.random() < dt * 0.5) {
ceiling.motes[i] = spawnBeamMote();
continue;
}
drawMote(p);
}
for (const p of ceiling.sift) {
const k = (now - p.born) / p.life;
const a = p.alpha;
p.alpha = a * Math.min(1, (1 - k) * 3);
drawMote(p);
p.alpha = a;
}
ctx.globalAlpha = 1;
ctx.globalCompositeOperation = 'source-over';
}
// ---------- Шаги наверху ----------
function scheduleSteps() {
clearTimeout(ceiling.stepsTimer);
ceiling.stepsTimer = setTimeout(() => {
if (!ceiling.walker && Math.random() < STEPS_CHANCE) startWalk();
scheduleSteps();
}, dustRand(STEPS_GAP[0], STEPS_GAP[1]));
}
function startWalk() {
const W = LAYOUT.CONTAINER_W;
const dir = Math.random() < 0.5 ? -1 : 1;
const count = Math.round(dustRand(STEPS_COUNT[0], STEPS_COUNT[1]));
// Проход примерно по центру экрана
const startX = W / 2 - dir * (count * STEP_STRIDE) / 2 + dustRand(-100, 100);
ceiling.walker = { x: startX, shadowX: startX, dir };
let left = count;
const step = () => {
const w = ceiling.walker;
if (!w) return;
if (left-- <= 0) {
// Ушёл — тень уплывает за край
w.x += w.dir * 400;
setTimeout(() => { ceiling.walker = null; }, 1200);
return;
}
w.x += w.dir * STEP_STRIDE * dustRand(0.85, 1.15);
playStepSound(w.x / W * 2 - 1);
for (let i = 0; i < STEP_DUST; i++) {
ceiling.sift.push({
x: w.x + dustRand(-25, 25), y: dustRand(0, 4),
vx: dustRand(-4, 4), vy: dustRand(0, 10),
size: dustRand(0.5, 1.3), alpha: dustRand(0.6, 1),
born: performance.now(), life: dustRand(2500, 4500),
});
}
setTimeout(step, STEP_INTERVAL * dustRand(0.9, 1.1));
};
step();
}
// Глухой удар каблука по деревянному полу + короткий шорох доски
function playStepSound(pan) {
if (!state.audioEnabled || STEP_VOLUME <= 0) return;
const AC = window.AudioContext || window.webkitAudioContext;
if (!AC) return;
try {
if (!draft.audio) draft.audio = new AC();   // общий аудиоконтекст со сквозняком
const ac = draft.audio;
if (ac.state === 'suspended') ac.resume();
const t0 = ac.currentTime;
let out = ac.destination;
if (ac.createStereoPanner) {
const p = ac.createStereoPanner();
p.pan.value = Math.max(-1, Math.min(1, pan * 0.8));
p.connect(ac.destination);
out = p;
}
const osc = ac.createOscillator();
osc.type = 'sine';
osc.frequency.setValueAtTime(dustRand(75, 95), t0);
osc.frequency.exponentialRampToValueAtTime(40, t0 + 0.18);
const og = ac.createGain();
og.gain.setValueAtTime(0.0001, t0);
og.gain.exponentialRampToValueAtTime(STEP_VOLUME, t0 + 0.01);
og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
osc.connect(og).connect(out);
osc.start(t0);
osc.stop(t0 + 0.3);
if (!ceiling.noise) {
const len = Math.floor(ac.sampleRate * 0.3);
const buf = ac.createBuffer(1, len, ac.sampleRate);
const d = buf.getChannelData(0);
for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
ceiling.noise = buf;
}
const src = ac.createBufferSource();
src.buffer = ceiling.noise;
const lp = ac.createBiquadFilter();
lp.type = 'lowpass';
lp.frequency.value = 500;
const ng = ac.createGain();
ng.gain.setValueAtTime(STEP_VOLUME * 0.35, t0);
ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
src.connect(lp).connect(ng).connect(out);
src.start(t0);
src.stop(t0 + 0.15);
} catch (e) { /* без звука — не страшно */ }
}
function cassetteRectInContainer(cassette) {
return {
x: cassette.offsetLeft,
y: cassette.offsetTop,
w: cassette.offsetWidth,
h: cassette.offsetHeight,
};
}
// ========== МЕРЦАНИЕ ==========
const FLICKER_DURATION = 1500;
const FLICKER_MIN_GAP = 40;
const FLICKER_MAX_GAP = 190;
const FLICKER_BRIGHTNESS_LEVELS = [0.5, 0.65, 0.8, 0.95, 1.1, 1.25];
function startFlickerEffect(duration = FLICKER_DURATION) {
const scene = document.getElementById('scene');
if (!scene) return;
const generation = ++state.flickerGeneration;
const startTime = performance.now();
const baseBrightness = state.isLightOn ? 1 : 0.15;
scene.style.transition = 'none';
function step() {
if (generation !== state.flickerGeneration) return;
const elapsed = performance.now() - startTime;
if (elapsed >= duration) {
scene.style.filter = `brightness(${baseBrightness})`;
scene.style.transition = '';
return;
}
const level = FLICKER_BRIGHTNESS_LEVELS[
Math.floor(Math.random() * FLICKER_BRIGHTNESS_LEVELS.length)
];
scene.style.filter = `brightness(${level})`;
const nextDelay = FLICKER_MIN_GAP + Math.random() * (FLICKER_MAX_GAP - FLICKER_MIN_GAP);
setTimeout(step, nextDelay);
}
step();
}
function scheduleFlicker() {
const delay = 1500 + Math.random() * 3000;
state.flickerTimer = setTimeout(() => {
if (state.audioEnabled && state.isLightOn && Math.random() < 0.12) {
playRandomFlickerSound();
startFlickerEffect(FLICKER_DURATION);
}
scheduleFlicker();
}, delay);
}
// ========== СВЕТ ==========
function toggleLight() {
const scene = document.getElementById('scene');
const lightSwitch = document.getElementById('lightSwitch');
const overlayImage = document.getElementById('overlayImage');
playSwitchSound();
if (state.isLightOn) {
state.flickerGeneration++;
stopFlickerSounds();
scene.style.transition = '';
scene.style.filter = 'brightness(0.15)';
lightSwitch.src = LIGHT_SWITCH_SRC.off;
overlayImage.style.opacity = '1';
state.isLightOn = false;
} else {
scene.style.filter = 'brightness(1)';
lightSwitch.src = LIGHT_SWITCH_SRC.on;
overlayImage.style.opacity = '0.5';
state.isLightOn = true;
playRandomFlickerSound();
startFlickerEffect(FLICKER_DURATION);
}
updateVcrGlowLight();
}
// ========== ИНИЦИАЛИЗАЦИЯ ==========
async function initialize() {
await Promise.all([preloadImages(), preloadAudio()]);
state.allAssetsLoaded = true;
const loadingText = document.getElementById('loadingText');
const loadingScreen = document.getElementById('loadingScreen');
loadingText.firstChild.nodeValue = 'ЗАЛЕЗТЬ В ПОГРЕБОК ';
loadingText.classList.add('ready');
loadingScreen.classList.add('ready');
loadingScreen.addEventListener('click', enterScene);
}
initialize();
window.addEventListener('resize', () => {
const scene = document.getElementById('scene');
if (scene && scene.style.display !== 'none') {
positionOverlayContainer();
}
});
</script>
