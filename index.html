<style>
:root {
--container-w: 1265px;
--container-h: 550px;
--poster-default-w: 300px;
--poster-aspect: 1.4;
--expand-offset-y: -10px;
--expand-scale-start: 0.2;
}
body {
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background-color: #000;
position: relative;
overflow: hidden;
}
.scene {
position: relative;
filter: brightness(0.15);
transition: filter 0.1s ease;
}
.container-wrapper,
.container,
.overlay-container,
.content-layer {
width: var(--container-w);
height: var(--container-h);
}
.container-wrapper {
position: relative;
overflow: visible;
}
.container {
background-image: url('./images/BGMod.jpg');
background-size: auto;
background-repeat: no-repeat;
background-position: center 2px;
position: relative;
overflow: hidden;
z-index: 0;
}
.overlay-container {
position: absolute;
overflow: hidden;
pointer-events: none;
z-index: 6;
}
.overlay-image {
position: absolute;
top: 0;
left: -50px;
width: 1367px;
height: 617px;
transition: opacity 0.2s ease;
}
.content-layer {
position: relative;
overflow: visible;
}
.vhs-cassette {
position: absolute;
width: 28px;
height: 192px;
box-shadow:
0 6px 18px rgba(0, 0, 0, 0.85),
0 3px 10px rgba(0, 0, 0, 0.75);
cursor: pointer;
transition: transform 0.2s ease;
z-index: 10;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
-webkit-user-drag: none;
-khtml-user-drag: none;
-moz-user-drag: none;
-o-user-drag: none;
user-drag: none;
}
.vhs-poster {
position: absolute;
width: 300px;
height: auto;
box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 0 8px 24px rgba(0, 0, 0, 0.7);
cursor: pointer;
z-index: 20;
transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
display: none;
transform-origin: top left;
will-change: transform;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
-webkit-user-drag: none;
-khtml-user-drag: none;
-moz-user-drag: none;
-o-user-drag: none;
user-drag: none;
}
.vhs-poster.poster-visible {
display: block;
}
.vhs-poster.expanding {
transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.poster-desc {
position: absolute;
z-index: 25;
max-width: 320px;
background: rgba(22, 19, 16, 0.93);
border: 1px solid rgba(255, 214, 140, 0.28);
border-radius: 8px;
padding: 12px 14px;
color: #f0e8d8;
font-family: Arial, sans-serif;
font-size: 13px;
line-height: 1.45;
box-shadow: 0 8px 24px rgba(0,0,0,0.7);
opacity: 0;
pointer-events: none;
transition: opacity 0.25s ease;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
.poster-desc.visible {
opacity: 1;
}
.light-switch {
position: absolute;
width: 56px;
height: 93px;
bottom: 10px;
right: 210px;
cursor: pointer;
z-index: 15;
object-fit: none;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
-webkit-user-drag: none;
-khtml-user-drag: none;
-moz-user-drag: none;
-o-user-drag: none;
user-drag: none;
}
#dust, #spider, #posterDust, #mothFly {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
}
#dust { z-index: 12; }
#spider { z-index: 13; }
#mothFly { z-index: 18; }
#posterDust { z-index: 22; }
#ceilingLight {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
}
#vcrGlow {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
transition: opacity 0.6s ease;
}
.vcr-glow {
position: absolute;
border-radius: 50%;
opacity: 0.65;
transform: translate(-50%, -50%);
animation: vcrShimmer 4s ease-in-out infinite;
}
@keyframes vcrShimmer {
0%, 100% { opacity: 0.65; }
50% { opacity: 0.6; }
}
@media (prefers-reduced-motion: reduce) {
.vcr-glow { animation: none; }
}
.cassette-dust {
position: absolute;
width: 28px;
height: 18px;
z-index: 11;
pointer-events: none;

}
.vhs-sound-zone {

bottom: 1px;
width: 590px;
height: 90px;
background: transparent;
border: none;

z-index: 15;
}
#loadingScreen {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #000;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 1000;

}
#loadingGif {
margin-bottom: 20px;
max-width: 200px;
height: auto;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
#loadingText {
color: #888;
font-family: Arial, sans-serif;
font-size: 24px;
text-align: center;
pointer-events: none;
transition: color 0.3s ease;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
#loadingText.ready {
color: #fff;

}
#loadingWarn {
margin-top: 14px;
color: #ffb347;
font-family: Arial, sans-serif;
font-size: 14px;
text-align: center;
max-width: 640px;
pointer-events: none;
-webkit-user-select: none;
-moz-user-select: none;
-ms-user-select: none;
user-select: none;
}
#loadingScreen.ready {
cursor: pointer;
}
.preload-bg {
position: absolute;
width: 1px;
height: 1px;
overflow: hidden;
opacity: 0;
pointer-events: none;
background-image: url('https://i127.ic.org/big/2026/0615/f9/305455d4898d3ee3df879a063d09c9f9.jpg');
}
</style>

<script>
const LAYOUT = { CONTAINER_W: 1265, CONTAINER_H: 550, POSTER_DEFAULT_W: 300, POSTER_ASPECT_RATIO: 420 / 300, EXPAND_OFFSET_Y: -10, EXPAND_SCALE_START: 0.2, EXPAND_CENTER_TARGET_X: 1200 };
const GRID = { CASSETTE_W: 28, CASSETTE_H: 192, COLS: 36, ROWS: 3, GAP_X: 6, GAP_Y: 10, EXTRA_ROW2_OFFSET: 5, EXTRA_ROW3_OFFSET: 13, GLOBAL_OFFSET_X: 6, SKIP_AFTER: 18 };
const AUDIO_URLS = {
pickSound1: './sounds/cassete_pick1.mp3', pickSound2: './sounds/cassete_pick2.mp3', openSounds: ['./sounds/cassete_take.mp3'],
backgroundMusic: './sounds/basement-ambience.ogg', switchSound: './sounds/light.mp3',
flickerSounds: ['./sounds/flicker1.mp3', './sounds/flicker2.mp3', './sounds/flicker3.mp3'], vhsHints: ['./sounds/VHS1.mp3', './sounds/VHS2.mp3'],
};
const LIGHT_SWITCH_SRC = { off: './images/off.PNG', on: './images/on.png' };

const cassettes = [
{ cassette: './images/wervolf_VHS.jpg', poster: './images/wervolf_cover.jpg', desc: '1997. УЖАСЫ, КОМЕДИЯ. Трое парней путешествуют по Европе в поисках приключений. Они находят их в Париже, когда однажды ночью предотвращают самоубийство молодой девушки.' },
{ cassette: './images/stalk_vhs.jpg', poster: './images/stalk_poster.jpg', desc: '2023. ТРИЛЛЕР, БОЕВИК, КРИМИНАЛ. В сельской местности штата Орегон девушка спасается бегством от разъярённого мужчины с ружьём.' },
{ cassette: './images/pochka_vhs.JPG', poster: './images/pochka_poster.jpg', desc: '2026. ДРАМА, КОМЕДИЯ. Коррумпированная инспектор пожарной службы узнает, что смертельно больна, и ей срочно нужна почка для пересадки. Столкнувшись с отказом презирающих её родственников, она пускается во все тяжкие и использует любые незаконные способы, чтобы выжить.' },
{ cassette: './images/machete_vhs.jpg', poster: './images/machete_poster.jpg', desc: '2010. БОЕВИК, КОМЕДИЯ, КРИМИНАЛ. Вооруженный холодным оружием коп жестоко мстит за семью. Первая главная роль харизматичного Дэнни Трехо.' },
{ cassette: './images/cycle_vhs.JPG', poster: './images/cycle_poster.jpg', desc: '2026. УЖАСЫ, ТРИЛЛЕР. Расследование жестокого убийства оборачивается для антрополога Мэг Гарланд шокирующим открытием — среди улик она находит останки отца, исчезнувшего 40 лет назад. Пытаясь разобраться в происходящем, Мэг погружается в пучину паранормального кошмара.' },
{ cassette: './images/longlegs_vhs.jpg', poster: './images/longlegs_poster.jpg', desc: '2023. ТРИЛЛЕР, УЖАСЫ, ДЕТЕКТИВ. Сотрудница ФБР с необычным даром идет по следу маньяка-сатаниста.' },
{ cassette: './images/13sins_vhs.jpg', poster: './images/13sins_poster.jpg', desc: '2013. ТРИЛЛЕР, УЖАСЫ. Чтобы зарабoтать, неудачник соглашается выполнить 13 странных заданий.' },
{ cassette: './images/cryst_vhs.jpg', poster: './images/cryst_poster.JPG', desc: '2026. УЖАСЫ, ТРИЛЛЕР, ДРАМА. Трагическая гибель мальчика Джейсона в летнем лагере из-за халатности вожатых сводит его мать с ума. Встав на путь жестокой мести, она превращает курортную зону в место кровавой бойни.' },
{ cassette: './images/claust_vhs.jpg', poster: './images/claust_poster.jpg', desc: '2021. УЖАСЫ, ТРИЛЛЕР. Безобидный квест в зловещем бункере оборачивается кошмаром для наивных участников.' },
{ cassette: './images/body_vhs.jpg', poster: './images/body_poster.jpg', desc: '1986. ДРАМА, ПРИКЛЮЧЕНИЯ. 1950-е. Лето подходит к концу. Четверо друзей-подростков отправляются посмотреть на труп.' },
{ cassette: './images/rabbit_vhs.jpg', poster: './images/rabbit_poster.jpg', desc: '2011. БОЕВИК. КРИМИНАЛ. ДРАМА. Скромный учитель вступает в тайный отряд мстителей.' },
{ cassette: './images/colombo_vhs.jpg', poster: './images/colombo_poster.jpg', desc: '1968. ДЕТЕКТИВ, КРИМИНАЛ. Лейтенант Коломбо - антипод классического детектива: он рассеян и несовременен, курит дешевые сигары, все время ходит в одном и том же мятом плаще, ездит на разваливающемся «Пежо» и за женщинами не ухлестывает, потому как давно и беспросветно женат.' },
{ cassette: './images/porn_vhs.jpg', poster: './images/porn_poster.jpg', desc: 'ДОКУМЕНТАЛЬНЫЙ. Альманах короткометражек, записанный поверх мультфильма "Аладдин".' },
{ cassette: './images/moana_vhs.JPG', poster: './images/moana_poster.jpg', desc: '2026. ФЭНТЕЗИ, КОМЕДИЯ, СЕМЕЙНЫЙ. Моана откликается на зов океана. Впервые в жизни она отправляется за риф своего острова Мотунуи вместе с прославленным полубогом Мауи.' },
{ cassette: './images/god_vhs.JPG', poster: './images/god_poster.JPG', desc: '2026. ФАНТАСТИКА, ДРАМА, ПРИКЛЮЧЕНИЯ. Земной историк Антон отправляется на планету, застрявшую в глухом Средневековье, под видом благородного дона Руматы Эсторского. Ему поручено тайно оберегать местных мыслителей и ученых, но с каждым днем соблюдать запрет на вмешательство в жестокие дела чужого мира становится все сложнее.' },
{ cassette: './images/repl_vhs.jpg', poster: './images/repl_poster.jpg', desc: '2024. ДРАМА, ФАНТАСТИКА. Один из двух братьев-учёных, разрабатывающих технологию цифрового бессмертия, тайно создаёт ИИ-копию сознания жены своего брата и убеждает виртуального двойника в том, что именно он является её законным мужем.' },
{ cassette: './images/dark_vhs.jpg', poster: './images/dark_poster.jpg', desc: '1992. УЖАСЫ, ТРИЛЛЕР, ДЕТЕКТИВ. Успешный писатель решается на символические похороны своего жестокого литературного псевдонима, после чего вымышленный двойник материализуется и начинает кровавую охоту на всех, кто причастен к его "смерти".' },
{ cassette: './images/fear_vhs.jpg', poster: './images/fear_poster.jpg', desc: '1991. ТРИЛЛЕP, ДРАМА, КРИМИНАЛ. Макс Кейди выходит из тюрьмы после долгого срока и начинает изощрённый психологический террор против своего бывшего адвоката и его семьи, мстя за то, что тот намеренно скрыл важные улики на суде.' },
{ cassette: './images/astral_vhs.JPG', poster: './images/astral_poster2.jpg', desc: '2026. УЖАСЫ. Молодая женщина обнаруживает, что может перемещаться в небытие и приносить оттуда в наш мир зловещих призраков.' },
{ cassette: './images/kings_vhs.jpg', poster: './images/kings_poster.jpg', desc: '2008. БОЕВИК, ТРИЛЛЕР, КРИМИНАЛ. Детектив лос-анджелесской полиции, привыкший жестоко вершить правосудие в обход закона, оказывается под подозрением в убийстве бывшего напарника.' },
{ cassette: './images/zlo_vhs.jpg', poster: './images/zlo_poster.JPG', desc: '2026. УЖАСЫ. Несколько зловещих историй объединены темой смертоносного звука: от радиочастот, сводящих людей с ума, до жутких музыкальных ритуалов, вызывающих монстров. ' },
{ cassette: './images/run_vhs.jpg', poster: './images/run_poster.jpg', desc: '2026. БОЕВИК, ТРИЛЛЕР, ДРАМА. Успешная лондонская адвокатесса во время утренней пробежки узнаёт об похищении сына и вынуждена без остановки мчаться через весь город, выполняя безумные приказы телефонного шантажиста, чтобы спасти ребёнка.' },
{ cassette: './images/lie_vhs.JPG', poster: './images/lie_poster.jpg', desc: '2009. ФЭНТЕЗИ, ДРАМА, КОМЕДИЯ. В мире, где люди не умеют врать и всегда говорят только правду, неудачливый сценарист первым в истории придумывает ложь. Что позволяет ему быстро разбогатеть, изменить свою жизнь и даже создать религию.' },
{ cassette: './images/hour_vhs.jpg', poster: './images/hour_poster.jpg', desc: '2003. ФАНТАСТИКА, БОЕВИК, ТРИЛЛЕР. Айтишник раскрывает тайны корпорации, которая стерла ему память.' },
{ cassette: './images/more_vhs.jpg', poster: './images/more_poster.jpg', desc: '2021. ДРАМА. Влюблённые подростки, сбежавшие от всех в заброшенный домик посреди глухого леса, пытаются разобраться в своих хрупких чувствах и ночных кошмарах о всемирном потопе.' },
{ cassette: './images/caveat_vhs.jpg', poster: './images/caveat_poster.jpg', desc: '2020. УЖАСЫ. Мужчина соглашается за деньги приглядеть за психически нестабильной Ольгой в заброшенном доме на уединённом острове, но по условиям договора даёт приковать себя длинной цепью.' },
{ cassette: './images/koteyka_vhs.jpg', poster: './images/koteyka_poster.jpg', desc: '2026. БОЕВИК, ФАНТАСТИКА, ТРИЛЛЕР. Кошка сражается с полчищами зомби, пытаясь доставить выжившим людям экспериментальную вакцину от зомби-вируса.' },
{ cassette: './images/zakl_vhs.jpg', poster: './images/zakl_poster.jpg', desc: '2025. УЖАСЫ. Экзорцисты помогают семье, которую преследует сущность из зеркал.' },
{ cassette: './images/x_vhs.jpg', poster: './images/x_poster.jpg', desc: '1993. ФАНТАСТИКА, ДЕТЕКТИВ, УЖАСЫ. Агенты ФБР сталкиваются со всяким сверхъестественным и не очень.' },
{ cassette: './images/milk_vhs.jpg', poster: './images/milk_poster.jpg', desc: '2016. ФЭНТЕЗИ, ДРАМА, КОМЕДИЯ. Флегматичный сербский молочник, ежедневно перевозящий провизию через линию фронта, влюбляется в таинственную и прекрасную итальянку, что превращает его жизнь в череду фантастических и опасных приключений.' },
{ cassette: './images/better_vhs.jpg', poster: './images/better_poster.jpg', desc: '2012. ТРИЛЛЕР, ДРАМА, КРИМИНАЛ. Управляющий аукционного дома, влюбляется в загадочную молодую наследницу, что полностью переворачивает его тщательно выстроенную жизнь.' },
{ cassette: './images/unnamed_vhs.png', poster: './images/unnamed_poster.png', posterWidth: 250, desc: 'Странная кассета без обложки и с написанным от руки предупреждением.' },
{ cassette: './images/fame_vhs.jpg', poster: './images/fame_poster.jpg', desc: '2026. КОМЕДИЯ, ДРАМА. Пожилой почтальон неожиданно обретает славу, когда компания богатой молодёжи случайно находит его старые юношеские стихи. Позднее признание возвращает писателю вдохновение, но социальные различия разрушают его отношения с новыми поклонниками.' },

{ cassette: './images/9_vhs.jpg', poster: './images/9_poster.jpg', desc: '2009. ФАНТАСТИКА, ТРИЛЛЕР, БОЕВИК. Инопланетные беженцы годами выживают в изолированных городских трущобах, сталкиваясь с жестокостью и принудительным выселением со стороны людей. Всё меняется, когда обычный чиновник подхватывает внеземной вирус и превращается в единственную зацепку для раскрытия тайн чужаков.' },

{ cassette: './images/balkan_vhs.jpg', poster: './images/balkan_poster.jpg', desc: '2019. БОЕВИК, ВОЕННЫЙ, ДРАМА. Российская спецгруппа получает секретный приказ захватить и удерживать до прихода миротворцев стратегически важный аэродром Слатина в Косово, вступая в неравный и жестокий бой с албанскими боевиками.' },
];
const DESC_DELAY = 500;
let descTimer = null;

const state = {
audioEnabled: false, audioElements: null, isLightOn: false, allAssetsLoaded: false,
currentExpandedPoster: null, isAnimating: false, flickerTimer: null, flickerGeneration: 0,
preloadedResources: [], brokenAudioCount: 0,
};

function initAudio() {
state.audioElements = {
pickSound1: new Audio(AUDIO_URLS.pickSound1), pickSound2: new Audio(AUDIO_URLS.pickSound2),
openSounds: AUDIO_URLS.openSounds.map(url => new Audio(url)), backgroundMusic: new Audio(AUDIO_URLS.backgroundMusic),
flickerSounds: AUDIO_URLS.flickerSounds.map(url => new Audio(url)), switchSound: new Audio(AUDIO_URLS.switchSound),
vhsHints: AUDIO_URLS.vhsHints.map(url => new Audio(url)),
};
state.audioElements.backgroundMusic.loop = true;
state.audioElements.backgroundMusic.volume = 0.3;
}
function playRandomPickSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sound = Math.random() > 0.5 ? state.audioElements.pickSound1 : state.audioElements.pickSound2;
sound.currentTime = 0; sound.play().catch(() => {});
}
function playOpenSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sounds = state.audioElements.openSounds;
const sound = sounds[Math.floor(Math.random() * sounds.length)];
sound.currentTime = 0; sound.play().catch(() => {});
}
function playRandomFlickerSound() {
if (!state.audioEnabled || !state.audioElements) return;
const sounds = state.audioElements.flickerSounds;
const sound = sounds[Math.floor(Math.random() * sounds.length)];
sound.currentTime = 0; sound.play().catch(() => {});
}
function playSwitchSound() {
if (!state.audioEnabled || !state.audioElements) return;
state.audioElements.switchSound.currentTime = 0;
state.audioElements.switchSound.play().catch(() => {});
}
function playRandomVhsHint() {
if (!state.audioEnabled || !state.audioElements) return;
const sounds = state.audioElements.vhsHints;
const sound = sounds[Math.floor(Math.random() * sounds.length)];
sound.currentTime = 0; sound.play().catch(() => {});
return sound;
}
function stopFlickerSounds() {
if (!state.audioElements) return;
state.audioElements.flickerSounds.forEach(sound => { sound.pause(); sound.currentTime = 0; });
}
function tryPlayBackgroundMusic() {
const music = state.audioElements && state.audioElements.backgroundMusic;
if (!music) return;
const promise = music.play();
if (!promise || typeof promise.catch !== 'function') return;
promise.catch(() => {
const handleInteraction = () => music.play().catch(() => {});
document.addEventListener('click', handleInteraction, { once: true });
document.addEventListener('keydown', handleInteraction, { once: true });
});
}

function getDescElement() {
let el = document.getElementById('posterDesc');
if (!el) { el = document.createElement('div'); el.id = 'posterDesc'; el.className = 'poster-desc'; document.getElementById('container').appendChild(el); }
return el;
}
function hidePosterDesc() {
if (descTimer) { clearTimeout(descTimer); descTimer = null; }
const el = document.getElementById('posterDesc');
if (el) el.classList.remove('visible');
}
function showPosterDesc(poster, index) {
const data = cassettes[index];
const text = data ? (data.desc || '') : '';
if (!text) return;
const container = document.getElementById('container');
const el = getDescElement();
el.textContent = text;
const containerRect = container.getBoundingClientRect();
const posterRect = poster.getBoundingClientRect();
const descW = el.offsetWidth;
const descH = el.offsetHeight;
let left = (posterRect.right - containerRect.left) + 14;
if (left + descW > containerRect.width - 8) left = (posterRect.left - containerRect.left) - descW - 14;
if (left < 8) left = 8;
let top = posterRect.top - containerRect.top;
top = Math.max(8, Math.min(top, containerRect.height - descH - 8));
el.style.left = left + 'px';
el.style.top = top + 'px';
el.classList.add('visible');
}

function preloadImages() {
const baseUrls = ['./images/BGMod.jpg', './images/lightsMod.png', './images/catModGif.gif', './images/off.PNG', './images/on.png'];
const urls = [...baseUrls, ...cassettes.flatMap(c => [c.cassette, c.poster])];
return new Promise((resolve) => {
let loaded = 0;
const total = urls.length;
if (total === 0) { resolve(); return; }
urls.forEach(src => {
const img = new Image();
state.preloadedResources.push(img);
const done = () => { loaded++; if (loaded === total) resolve(); };
img.onload = done; img.onerror = done; img.src = src;
});
});
}
function preloadAudio() {
return new Promise((resolve) => {
initAudio();
const elements = [state.audioElements.pickSound1, state.audioElements.pickSound2, ...state.audioElements.openSounds, state.audioElements.backgroundMusic, state.audioElements.switchSound, ...state.audioElements.flickerSounds, ...state.audioElements.vhsHints];
let loaded = 0, broken = 0, settled = false;
const total = elements.length;
const finish = () => { if (settled) return; settled = true; state.brokenAudioCount = broken; resolve(); };
if (total === 0) { finish(); return; }
setTimeout(finish, 25000);
elements.forEach(audio => {
audio.addEventListener('canplaythrough', () => { if (settled) return; loaded++; if (loaded === total) finish(); }, { once: true });
audio.addEventListener('error', () => { broken++; if (settled) return; loaded++; if (loaded === total) finish(); }, { once: true });
audio.load();
});
});
}

function enterScene() {
if (!state.allAssetsLoaded) return;
document.getElementById('loadingScreen').style.display = 'none';
const scene = document.getElementById('scene');
scene.style.display = 'block';
positionOverlayContainer();
state.isLightOn = false;
state.audioEnabled = true;
tryPlayBackgroundMusic();
createCassettes();
setupDust();
setupSpider();
setupFlyingMoth();
setupVcrGlow();
setupCeilingLight();
setupDraft();
scheduleFlicker();
}

function gridSlot(i) {
const row = Math.floor(i / GRID.COLS);
const colInRow = i % GRID.COLS;
const col = colInRow >= GRID.SKIP_AFTER ? colInRow + 1 : colInRow;
const left = col * (GRID.CASSETTE_W + GRID.GAP_X) + GRID.GLOBAL_OFFSET_X;
let top = row * (GRID.CASSETTE_H + GRID.GAP_Y);
if (row === 1) top += GRID.EXTRA_ROW2_OFFSET;
if (row === 2) top += GRID.EXTRA_ROW3_OFFSET;
return { left, top };
}
function positionOverlayContainer() {
const scene = document.getElementById('scene');
const overlay = document.getElementById('overlayContainer');
if (!scene || !overlay) return;
const rect = scene.getBoundingClientRect();
overlay.style.left = rect.left + 'px';
overlay.style.top = rect.top + 'px';
}

function createCassettes() {
const container = document.getElementById('container');
const fragment = document.createDocumentFragment();
const total = Math.min(cassettes.length, GRID.COLS * GRID.ROWS);
for (let i = 0; i < total; i++) {
const cassette = document.createElement('img');
cassette.src = cassettes[i].cassette;
cassette.className = 'vhs-cassette';
cassette.id = `cassette${i + 1}`;
cassette.dataset.index = i;
cassette.draggable = false;
cassette.setAttribute('draggable', 'false');
const poster = document.createElement('img');
poster.src = cassettes[i].poster;
poster.className = 'vhs-poster';
poster.id = `poster${i + 1}`;
poster.draggable = false;
poster.setAttribute('draggable', 'false');
if (cassettes[i].posterWidth) poster.style.width = `${cassettes[i].posterWidth}px`;
poster.addEventListener('mouseenter', () => {
if (state.currentExpandedPoster !== poster) return;
if (descTimer) clearTimeout(descTimer);
descTimer = setTimeout(() => showPosterDesc(poster, i), DESC_DELAY);
});
poster.addEventListener('mouseleave', () => { hidePosterDesc(); });
const { left, top } = gridSlot(i);
cassette.style.left = `${left}px`;
cassette.style.top = `${top}px`;
fragment.appendChild(cassette);
const topDust = createTopDust(cassette, i);
if (topDust) fragment.appendChild(topDust);
fragment.appendChild(poster);
}
container.appendChild(fragment);
setupLeaningCassettes(total);
container.addEventListener('click', handleContainerClick);
container.addEventListener('mouseenter', handleContainerMouseEnter, true);
container.addEventListener('mouseleave', handleContainerMouseLeave, true);
}

function handleContainerClick(e) {
const poster = e.target.closest('.vhs-poster');
if (poster && poster.classList.contains('poster-visible')) { collapseCurrentPoster(); return; }
const cassette = e.target.closest('.vhs-cassette');
if (!cassette) return;
const index = parseInt(cassette.dataset.index, 10);
const posterEl = document.getElementById(`poster${index + 1}`);
handleCassetteClick(cassette, posterEl, cassettes[index].posterWidth || LAYOUT.POSTER_DEFAULT_W);
}
function handleContainerMouseEnter(e) {
const cassette = e.target.closest('.vhs-cassette');
if (!cassette) return;
playRandomPickSound();
const shift = Math.random() > 0.5 ? 4 : -4;
straightenCassette(cassette, true);
setCassetteShift(cassette, `translateY(${shift}px)`);
const canPuff = !TOP_DUST_ENABLED || isCassetteDusty(cassette);
if (PUFF_ON_HOVER && canPuff && Math.random() < PUFF_HOVER_CHANCE) {
puffDust(cassetteRectInContainer(cassette), 'hover');
}
}
function handleContainerMouseLeave(e) {
const cassette = e.target.closest('.vhs-cassette');
if (!cassette) return;
setCassetteShift(cassette, 'none');
}

function handleCassetteClick(cassette, poster, posterWidth) {
if (state.currentExpandedPoster?.dataset.cassetteId === cassette.id) { collapseCurrentPoster(); return; }
if (state.currentExpandedPoster) {
collapseCurrentPoster(() => expandCassette(cassette, poster, posterWidth));
return;
}
expandCassette(cassette, poster, posterWidth);
}
function expandCassette(cassette, poster, posterWidth) {
if (state.isAnimating) return;
state.isAnimating = true;
cassette.style.opacity = '0';
cassette.style.pointerEvents = 'none';
const container = document.getElementById('container');
const containerRect = container.getBoundingClientRect();
const cassetteRect = cassette.getBoundingClientRect();
const x = cassetteRect.left - containerRect.left;
const y = cassetteRect.top - containerRect.top;
poster.style.transform = `translate(${x}px, ${y + LAYOUT.EXPAND_OFFSET_Y}px) scale(${LAYOUT.EXPAND_SCALE_START})`;
poster.classList.add('poster-visible', 'expanding');
poster.dataset.cassetteId = cassette.id;
state.currentExpandedPoster = poster;
playOpenSound();
const wasDusty = !TOP_DUST_ENABLED || isCassetteDusty(cassette);
puffDust(cassetteRectInContainer(cassette), wasDusty ? 'pull' : 'hover');
wipeTopDust(cassette);
straightenCassette(cassette, false);
requestAnimationFrame(() => {
setTimeout(() => {
const centerX = (LAYOUT.EXPAND_CENTER_TARGET_X - posterWidth) / 2;
const posterHeight = posterWidth * LAYOUT.POSTER_ASPECT_RATIO;
const centerY = (LAYOUT.CONTAINER_H - posterHeight) / 2 + LAYOUT.EXPAND_OFFSET_Y;
poster.style.transform = `translate(${centerX}px, ${centerY}px) scale(1)`;
setTimeout(() => {

const MOTH_FLY_ENABLED = true;

const mothFly = {
    ctx: null, active: false, timer: null, path: [], progress: 0, speed: 0,

    if (!mothFly.ctx) return;
}

function scheduleMothFly() {
    clearTimeout(mothFly.timer);
    if (!state.isLightOn || mothFly.active) return;
    const delay = dustRand(MOTH_FLY_DELAY_MIN, MOTH_FLY_DELAY_MAX);
    mothFly.timer = setTimeout(startMothFlySequence, delay);
}

function startMothFlySequence() {
    if (!state.isLightOn) { scheduleMothFly(); return; }
    generateMothPath();
    mothFly.active = true;
    mothFly.progress = 0;
    mothFly.flap = 0;
    mothFly.wigglePhase = 0;
    mothFly.isFleeing = false;
    mothFly.fleeVx = 0;
    mothFly.fleeVy = 0;
    
    // Инициализируем начальные координаты, чтобы не было мгновенного испуга при спавне
    const p0 = mothFly.path[0];
    mothFly.x = p0.x;
    mothFly.y = p0.y;
    mothFly.prevX = p0.x;
    mothFly.prevY = p0.y;

    const ctx = mothFly.ctx;
    let last = performance.now();

    const frame = (now) => {
        if (!mothFly.active) return;
        const dt = Math.min((now - last) / 1000, 0.05);

                if (dist < MOTH_SCARE_RADIUS) {

                    const dy = mothFly.y - mothFly.mouseY;

                    const target = Math.atan2(mothFly.fleeVy, mothFly.fleeVx) + Math.PI / 2;
                    mothFly.heading = target;
                }
            }

            if (mothFly.progress >= 1) {
                mothFly.active = false;
                ctx.clearRect(0, 0, LAYOUT.CONTAINER_W, LAYOUT.CONTAINER_H);
                const cooldown = dustRand(MOTH_FLY_COOLDOWN_MIN, MOTH_FLY_COOLDOWN_MAX);
                mothFly.timer = setTimeout(scheduleMothFly, cooldown);
                return;
            }

            const t = mothFly.progress;
            const p0 = mothFly.path[0], p1 = mothFly.path[1], p2 = mothFly.path[2], p3 = mothFly.path[3];
            let x = Math.pow(1-t,3)*p0.x + 3*Math.pow(1-t,2)*t*p1.x + 3*(1-t)*Math.pow(t,2)*p2.x + Math.pow(t,3)*p3.x;
            let y = Math.pow(1-t,3)*p0.y + 3*Math.pow(1-t,2)*t*p1.y + 3*(1-t)*Math.pow(t,2)*p2.y + Math.pow(t,3)*p3.y;

            const wiggleX = Math.sin(mothFly.wigglePhase * 1.5) * 15 + Math.sin(mothFly.wigglePhase * 2.8) * 8;
            const wiggleY = Math.cos(mothFly.wigglePhase * 1.2) * 12 + Math.cos(mothFly.wigglePhase * 2.3) * 6;
            x += wiggleX;
            y += wiggleY;

            if (mothFly.prevX !== null && mothFly.prevY !== null) {
                const dx = x - mothFly.prevX;
                const dy = y - mothFly.prevY;
                if (Math.hypot(dx, dy) > 0.5) {
                    const target = Math.atan2(dy, dx) + Math.PI / 2;
                    let diff = target - mothFly.heading;
                    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                    mothFly.heading += diff * Math.min(1, dt * 6);
                }
            }
            
            mothFly.prevX = x;
            mothFly.prevY = y;
            mothFly.x = x;
            mothFly.y = y;
        } else {
            // Логика побега
            mothFly.x += mothFly.fleeVx * dt;
            mothFly.y += mothFly.fleeVy * dt;

            // Если улетел далеко за пределы экрана, завершаем полёт
            if (mothFly.x < -150 || mothFly.x > LAYOUT.CONTAINER_W + 150 || 
                mothFly.y < -150 || mothFly.y > LAYOUT.CONTAINER_H + 150) {
                mothFly.active = false;
                ctx.clearRect(0, 0, LAYOUT.CONTAINER_W, LAYOUT.CONTAINER_H);
                const cooldown = dustRand(MOTH_FLY_COOLDOWN_MIN, MOTH_FLY_COOLDOWN_MAX);
                mothFly.timer = setTimeout(scheduleMothFly, cooldown);
                return;
            }
        }

        const open = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(mothFly.flap));

        if (MOTH_FLY_SHADOW > 0) {
            const sx = mothFly.x + 18;
            const sy = mothFly.y + 22;
            ctx.globalAlpha = MOTH_FLY_SHADOW;
            ctx.filter = 'blur(2px)';
            drawMothShape(ctx, sx, sy, mothFly.heading, open, MOTH_FLY_SCALE * 1.6, MOTH_FLY_SHADOW_COLORS);
            ctx.filter = 'none';
            ctx.globalAlpha = 1;
        }

        ctx.globalAlpha = 1;
        drawMothShape(ctx, mothFly.x, mothFly.y, mothFly.heading, open, MOTH_FLY_SCALE, MOTH_FLY_COLORS);

        requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
}

function generateMothPath() {
    const W = LAYOUT.CONTAINER_W, H = LAYOUT.CONTAINER_H;
    const margin = 80;
    const sides = ['left', 'right', 'top', 'bottom'];
    const entrySide = sides[Math.floor(Math.random() * sides.length)];
    let exitSide = sides[Math.floor(Math.random() * sides.length)];
    while (exitSide === entrySide) exitSide = sides[Math.floor(Math.random() * sides.length)];

    const getPoint = (side) => {
        let x, y;
        if (side === 'left') { x = -margin; y = dustRand(margin, H - margin); }
        else if (side === 'right') { x = W + margin; y = dustRand(margin, H - margin); }
        else if (side === 'top') { x = dustRand(margin, W - margin); y = -margin; }
        else { x = dustRand(margin, W - margin); y = H + margin; }
        return { x, y };
    };

    const start = getPoint(entrySide);
    const end = getPoint(exitSide);

    const midX = (start.x + end.x) / 2 + dustRand(-250, 250);
    const midY = (start.y + end.y) / 2 + dustRand(-180, 180);
    const cp1 = { x: start.x + (midX - start.x) * dustRand(0.4, 0.7), y: start.y + (midY - start.y) * dustRand(0.4, 0.7) };
    const cp2 = { x: end.x + (midX - end.x) * dustRand(0.4, 0.7), y: end.y + (midY - end.y) * dustRand(0.4, 0.7) };

    mothFly.path = [start, cp1, cp2, end];
    const duration = dustRand(5, 8);
    mothFly.speed = 1 / duration;
}

function drawMothShape(ctx, x, y, heading, open, scale, colors) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(heading);
    ctx.scale(scale, scale);

    for (const s of [-1, 1]) {
        ctx.fillStyle = colors.fore;
        ctx.beginPath();
        ctx.moveTo(0, -1.5);
        ctx.quadraticCurveTo(s * 7 * open, -5, s * 8.5 * open, 1);
        ctx.quadraticCurveTo(s * 4 * open, 2.5, 0, 1.5);
        ctx.fill();

        ctx.fillStyle = colors.hind;
        ctx.beginPath();
        ctx.moveTo(0, 0.5);
        ctx.quadraticCurveTo(s * 5.5 * open, 1.5, s * 4.5 * open, 5);
        ctx.quadraticCurveTo(s * 2 * open, 5.5, 0, 3.5);
        ctx.fill();
    }

    ctx.fillStyle = colors.body;
    ctx.beginPath();
    ctx.ellipse(0, 1, 1.1, 3.8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = colors.body;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(-0.4, -2.5); ctx.quadraticCurveTo(-1.5, -4.5, -2.5, -5);
    ctx.moveTo(0.4, -2.5);  ctx.quadraticCurveTo(1.5, -4.5, 2.5, -5);
    ctx.stroke();

    ctx.restore();
}

async function initialize() {
await Promise.all([preloadImages(), preloadAudio()]);
state.allAssetsLoaded = true;
const loadingText = document.getElementById('loadingText');
const loadingScreen = document.getElementById('loadingScreen');
loadingText.firstChild.nodeValue = 'ЗАЛЕЗТЬ В ПОГРЕБОК ';
loadingText.classList.add('ready');
loadingScreen.classList.add('ready');
loadingScreen.addEventListener('click', enterScene);
}
initialize();
window.addEventListener('resize', () => {
const scene = document.getElementById('scene');
if (scene && scene.style.display !== 'none') {
positionOverlayContainer();
}
});
</script>
